[project]
name = "qorageom"
version = "0.1.0"
description = "X-ray diffraction geometry: 2θ, q, d, detector pixel q, diffractometer rotations, BCDI reciprocal basis and strain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
keywords = ["x-ray diffraction", "BCDI", "diffractometer", "reciprocal space", "detector geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/QoraGeom"
Repository = "https://github.com/NaNIsaac/QoraGeom"
Issues = "https://github.com/NaNIsaac/QoraGeom/issues"
Changelog = "https://github.com/NaNIsaac/QoraGeom/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
examples = ["qoraphase"]
dev = ["pytest>=9.0"]

[tool.ruff]
line-length = 100


[tool.uv.sources]
qoraphase = { git = "https://github.com/NaNIsaac/QoraPhase" }

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
