[project]
name = "qorageom"
version = "0.1.0"
description = "Detector geometry for X-ray scattering: lab-frame q vector of a detector pixel"
readme = "README.md"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/QoraGeom"
Repository = "https://github.com/NaNIsaac/QoraGeom"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
